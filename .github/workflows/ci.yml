# Integración continua (D-02 en docs/DEUDA_TECNICA.md): en cada push y en cada
# pull request corre las pruebas (el backend contra un PostgreSQL 16 real, como
# en local), el lint, el formato, los builds y la auditoría de dependencias de
# producción. Si algo falla, el cambio no debe llegar a main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  calidad:
    name: Lint, formato y auditoría
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      # ESLint carga las dependencias de cada paquete para resolver sus tipos e importaciones.
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Cliente de Prisma (tipos que usa el lint del backend)
        run: npx prisma generate
        working-directory: backend
      - run: npm run lint
      - run: npm run format:check
      # D-07: falla si una dependencia que llega al servidor o al navegador tiene
      # un aviso alto o crítico. Las de desarrollo no se instalan en producción.
      - name: npm audit (backend, producción)
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - name: npm audit (frontend, producción)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  backend:
    name: Backend (pruebas contra PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # La misma versión que docker-compose.yml: la restricción EXCLUDE de la
        # no-sobreventa es de PostgreSQL.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel
          POSTGRES_DB: mvp_hotel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel -d mvp_hotel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # test/entorno.ts la usa en lugar de la base de pruebas por defecto.
      DATABASE_URL_TEST: postgresql://hotel:hotel@127.0.0.1:5432/mvp_hotel_test?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      # Las migraciones se aplican en el globalSetup de Jest (test/preparar-bd.ts).
      - run: npm test

  frontend:
    name: Frontend (pruebas y build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
